name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly fresh data (ADR 0008). The live window holds 60 days either side, so a week
  # between refreshes, or a few missed runs, never leaves the site without data.
  # Mondays 06:17 UTC: off the hour, when GitHub's scheduler is least busy.
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site-artifact-id: ${{ steps.build-artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev
      # Fresh ephemerides from JPL Horizons; a failed fetch fails the run (ADR 0002).
      - run: npm run data
      - run: npm run build
      - name: Upload the site
        id: build-artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: site-dist
          path: dist
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Deploys the artifact the check job built, without rebuilding (ADR 0008).
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download the checked build
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.check.outputs.site-artifact-id }}
          path: dist
          merge-multiple: true
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
