# Spacecraft models (ADR 0013): `npm run models` builds public/models/ from this list.
#
# - A model from elsewhere needs a direct `url` to a GLB or glTF, its `page`, the exact
#   `credit` and `licence`, and `rotate` (degrees about x, y, z) if it isn't already in
#   the body frame: +Z along the high-gain antenna, +Y along the solar arrays.
# - `own: true` builds ours from scripts/models/own/<id>.ts; the card says so.
# - `lengthM` is the real largest dimension; the model is scaled to it.

- id: bepicolombo
  own: true
  lengthM: 11.4
  credit: Apsis
  licence: MIT

- id: psyche
  own: true
  lengthM: 24.8
  credit: Apsis
  licence: MIT

- id: juno
  url: https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/j/Juno.glb
  page: https://science.nasa.gov/resource/juno-3d-model/
  credit: NASA VTAD
  licence: Public domain
  lengthM: 20.1
  rotate: [90, 0, 0]

- id: europa-clipper
  url: https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/c/clipper_spacecraft.glb
  page: https://science.nasa.gov/resource/europa-clipper-3d-model/
  credit: NASA VTAD
  licence: Public domain
  lengthM: 30.5
  simplify: 0.35
  rotate: [90, 90, 0]

- id: parker-solar-probe
  url: https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/p/s/PSP.glb
  page: https://science.nasa.gov/resource/parker-solar-probe-3d-model/
  credit: NASA VTAD
  licence: Public domain
  lengthM: 3
  rotate: [0, 180, 0]
  pointing: sun

- id: voyager-1
  url: https://assets.science.nasa.gov/content/dam/science/psd/solar/2023/09/v/Voyager.glb
  page: https://science.nasa.gov/resource/voyager-3d-model/
