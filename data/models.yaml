  credit: NASA VTAD
  licence: Public domain
  lengthM: 2.7
  rotate: [90, 0, 0]

- id: jwst
  url: https://raw.githubusercontent.com/nasa/NASA-3D-Resources/master/3D%20Models/James%20Webb%20Space%20Telescope%20(B)/James%20Webb%20Space%20Telescope%20(B).glb
  page: https://science.nasa.gov/3d-resources/james-webb-space-telescope-b/
