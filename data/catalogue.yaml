        date: 2016-10-19,
        es: 'Entra en órbita de Marte; el módulo Schiaparelli se estrella',
        en: 'Enters orbit around Mars; the Schiaparelli lander crashes',
      }
    - {
        date: 2017-03,
        es: Empieza a frenar rozando la atmósfera,
        en: Starts slowing down by skimming the atmosphere,
      }
    - {
        date: 2018-02-20,
