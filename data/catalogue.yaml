    es: La primera nave en orbitar un cometa y en posar un módulo sobre él, Philae, en 2014. Acompañó al cometa 67P en su paso por el Sol y terminó posándose sobre él en 2016.
    en: The first spacecraft to orbit a comet and set a lander on it, Philae, in 2014. It rode along with comet 67P past the Sun and ended by touching down on it in 2016.
  links: [https://www.esa.int/Science_Exploration/Space_Science/Rosetta]

- id: dawn
  name: Dawn
  agency: NASA
  launch: 2007-09-27
  target: { es: Vesta y Ceres, en: Vesta and Ceres }
  status: ended
  horizons: '-203'
  coverage: { from: 2007-09-28, to: 2018-11-01 }
  milestones:
    - {
        date: 2009-02-18,
        encounter: true,
        es: Pasa por Marte para tomar impulso,
        en: Swings past Mars for a boost,
      }
    - { date: 2011-07-16, es: Entra en órbita de Vesta, en: Enters orbit around Vesta }
    - { date: 2012-09-05, es: Deja Vesta rumbo a Ceres, en: Leaves Vesta for Ceres }
    - { date: 2015-03-06, es: Entra en órbita de Ceres, en: Enters orbit around Ceres }
    - {
        date: 2018-11-01,
        es: Se queda sin combustible y termina la misión,
        en: 'Runs out of fuel, ending the mission',
      }
  blurb:
    es: La única nave que orbitó dos cuerpos del cinturón de asteroides, Vesta y después Ceres, gracias a su propulsión eléctrica. Se quedó sin combustible en 2018 y sigue en órbita de Ceres.
    en: The only spacecraft to orbit two bodies in the asteroid belt, Vesta and then Ceres, thanks to electric propulsion. It ran out of fuel in 2018 and remains in orbit around Ceres.
  links: [https://science.nasa.gov/mission/dawn/]
