    es: La primera misión europea a Marte. Lo orbita desde 2003, mapea su superficie en 3D y su radar encontró indicios de agua líquida bajo el hielo del polo sur.
    en: Europe's first mission to Mars. Orbiting it since 2003, it maps the surface in 3D, and its radar found signs of liquid water under the south polar ice.
