        en: Swings past Jupiter for a boost,
      }
    - { date: 2015-07-14, encounter: true, es: Pasa por Plutón, en: Flies past Pluto }
    - { date: 2019-01-01, encounter: true, es: Pasa por Arrokoth, en: Flies past Arrokoth }
  blurb:
    es: Pasó por Plutón en 2015 y por Arrokoth en 2019, el objeto más lejano visitado hasta ahora. Sigue alejándose por el cinturón de Kuiper.
