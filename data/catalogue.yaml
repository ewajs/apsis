        encounter: true,
        es: Pasa otra vez por la Tierra,
        en: Swings past Earth again,
      }
    - {
        date: 1993-08-28,
        encounter: true,
        es: Pasa por el asteroide Ida,
        en: Flies past the asteroid Ida,
      }
    - {
        date: 1995-12-07,
        encounter: true,
