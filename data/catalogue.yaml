- id: exomars-tgo
  name: ExoMars Trace Gas Orbiter
  agency: ESA / Roscosmos
  launch: 2016-03-14
  target: { es: Marte, en: Mars }
  status: active
  horizons: '-143'
  coverage: { from: 2016-03-15, to: 2039-01-03 }
