# The missions Apsis shows (ADR 0009). Each entry is checked by `npm run data`.
#
# - Text is in Spanish (Argentina, voseo) and English; both are required.
# - `horizons` is the JPL Horizons ID, quoted ("-61"), or null with `noEphemeris`.
# - `coverage` is the span Horizons has data for (docs/guides/data.md says how to find it).
# - Milestone dates can be a day, a month or a year: YYYY-MM-DD, YYYY-MM or YYYY.
# - `encounter: true` (a flyby, a perihelion, an arrival) samples hourly for 3 days either
#   side; it needs an exact day.
# - A pull request that changes facts links its sources.

- id: juno
  name: Juno
  agency: NASA
  launch: 2011-08-05
  target: { es: Júpiter, en: Jupiter }
  status: active
  horizons: '-61'
  coverage: { from: 2011-08-06, to: 2028-09-01 }
  milestones:
    - {
        date: 2016-07-05,
        encounter: true,
        es: Entra en órbita de Júpiter,
        en: Enters orbit around Jupiter,
      }
    - { date: 2021-06-07, encounter: true, es: Pasa cerca de Ganimedes, en: Flies past Ganymede }
    - { date: 2022-09-29, encounter: true, es: Pasa cerca de Europa, en: Flies past Europa }
    - { date: 2023-12-30, encounter: true, es: Pasa cerca de Ío, en: Flies past Io }
  blurb:
    es: Orbita Júpiter desde 2016 en órbitas polares muy alargadas. Estudia el interior del planeta, sus auroras y sus lunas.
    en: Orbiting Jupiter since 2016 on long, polar orbits, studying the planet's interior, its auroras and its moons.
  links: [https://science.nasa.gov/mission/juno/]

- id: europa-clipper
  name: Europa Clipper
  agency: NASA
  launch: 2024-10-14
  target: { es: Europa (luna de Júpiter), en: Europa (moon of Jupiter) }
  status: active
  horizons: '-159'
  coverage: { from: 2024-10-15, to: 2034-09-02 }
  milestones:
    - {
        date: 2025-03-01,
        encounter: true,
        es: Pasa por Marte para tomar impulso,
        en: Swings past Mars for a boost,
      }
    - {
        date: 2026-12-03,
        encounter: true,
        es: Pasa por la Tierra para tomar impulso,
        en: Swings past Earth for a boost,
      }
    - { date: 2030-04, es: Llega a Júpiter, en: Arrives at Jupiter }
  blurb:
    es: Va camino a Júpiter para estudiar Europa, una luna con un océano bajo el hielo, y averiguar si tiene condiciones para la vida.
    en: On its way to Jupiter to study Europa, a moon with an ocean under its ice, and to find out whether it could be habitable.
  links: [https://science.nasa.gov/mission/europa-clipper/]

