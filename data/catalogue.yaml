        en: Finishes slowing down in the atmosphere,
      }
    - { date: 2018-04, es: Empieza su ciencia, en: Begins its science mission }
  blurb:
    es: Olfatea la atmósfera de Marte en busca de metano y otros gases que podrían delatar actividad geológica o biológica, y hace de repetidor para los róveres. Para llegar a su órbita frenó rozando la atmósfera durante casi un año.
    en: Sniffs Mars's atmosphere for methane and other gases that could betray geological or biological activity, and relays data from the rovers. To reach its orbit it slowed down by skimming the atmosphere for almost a year.
  links: [https://www.esa.int/Science_Exploration/Human_and_Robotic_Exploration/Exploration/ExoMars]

